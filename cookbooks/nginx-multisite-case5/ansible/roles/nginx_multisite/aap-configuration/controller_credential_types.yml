---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used when generating self-signed TLS certificates for all three nginx 
      virtual hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: The URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: The Conjur organization account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: The Conjur variable path for the SSL passphrase (e.g., production/nginx/ssl_passphrase)
        - id: conjur_api_key
          type: string
          label: Conjur API Key
          secret: true
          help_text: The API key or host factory token used to authenticate the Ansible controller or target node with CyberArk Conjur
        - id: ssl_passphrase
          type: string
          label: SSL Passphrase
          secret: true
          help_text: The passphrase retrieved from Conjur at path production/nginx/ssl_passphrase, passed as -passout to openssl req when generating private 
            keys for test.cluster.local, ci.cluster.local, and status.cluster.local
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - conjur_api_key
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        conjur_api_key: !unsafe "{{ conjur_api_key }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
  - name: OAuth2 Client Credentials
    description: OAuth2 client credentials used to obtain a bearer access token from the auth endpoint. Currently hardcoded in recipes/security.rb and must be 
      migrated to a secrets manager before deployment.
    kind: cloud
    inputs:
      fields:
        - id: oauth_token_url
          type: string
          label: OAuth Token URL
          help_text: The OAuth2 token endpoint URL (e.g., https://auth.example.com/oauth/token)
        - id: oauth_client_id
          type: string
          label: OAuth Client ID
          help_text: The OAuth2 client identifier used in the client-credentials POST body (e.g., nginx-multisite)
        - id: oauth_client_secret
          type: string
          label: OAuth Client Secret
          secret: true
          help_text: The OAuth2 client secret used in the client-credentials POST body. Currently hardcoded as 'sup3rs3cr3t' in recipes/security.rb — MUST be 
            rotated and stored securely before migration.
      required:
        - oauth_token_url
        - oauth_client_id
        - oauth_client_secret
    injectors:
      extra_vars:
        oauth_token_url: !unsafe "{{ oauth_token_url }}"
        oauth_client_id: !unsafe "{{ oauth_client_id }}"
        oauth_client_secret: !unsafe "{{ oauth_client_secret }}"
  - name: API Token Endpoint
    description: Runtime-fetched token from an undocumented API endpoint, parsed via regex from the response body. The endpoint may require authentication 
      headers not visible in the source. Downstream consumer is unknown.
    kind: cloud
    inputs:
      fields:
        - id: api_token_url
          type: string
          label: API Token URL
          help_text: The URL of the token endpoint to GET (e.g., https://api.example.com/token_endpoint)
        - id: api_token_parse_pattern
          type: string
          label: Token Parse Regex Pattern
          help_text: The regex pattern used to extract the token from the response body. Currently a placeholder ('pattern1:(.+)') — the real production pattern
            must be confirmed before migration.
        - id: api_auth_header
          type: string
          label: API Authentication Header
          secret: true
          help_text: Optional authentication header value required by the token endpoint, if any. Not visible in source — must be confirmed by the migration 
            team.
      required:
        - api_token_url
        - api_token_parse_pattern
    injectors:
      extra_vars:
        api_token_url: !unsafe "{{ api_token_url }}"
        api_token_parse_pattern: !unsafe "{{ api_token_parse_pattern }}"
        api_auth_header: !unsafe "{{ api_auth_header }}"
