---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL key passphrase used to generate self-signed TLS certificates for all three nginx virtual 
      hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: Conjur organization account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: Path to the secret variable in Conjur (e.g., production/nginx/ssl_passphrase)
        - id: conjur_api_key
          type: string
          label: Conjur API Key
          secret: true
          help_text: API key for the Conjur host identity used to authenticate and retrieve secrets
        - id: ssl_passphrase
          type: string
          label: SSL Key Passphrase
          secret: true
          help_text: Passphrase for the RSA private key used in openssl req -x509 certificate generation (-passout pass:...). Retrieved from Conjur path 
            production/nginx/ssl_passphrase.
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - conjur_api_key
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        conjur_api_key: !unsafe "{{ conjur_api_key }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
  - name: OAuth2 Client Credentials (fetch_token)
    description: OAuth2 client credentials used by the fetch_token custom resource to obtain an access token from the OAuth token endpoint. Currently hardcoded 
      in recipes/security.rb — must be migrated to a secrets manager.
    kind: cloud
    inputs:
      fields:
        - id: auth_url
          type: string
          label: OAuth Token Endpoint URL
          help_text: Full URL of the OAuth2 token endpoint (e.g., https://auth.example.com/oauth/token)
        - id: client_id
          type: string
          label: OAuth Client ID
          help_text: OAuth2 client identifier (e.g., nginx-multisite)
        - id: client_secret
          type: string
          label: OAuth Client Secret
          secret: true
          help_text: "OAuth2 client secret POSTed to the token endpoint. Currently hardcoded as 'sup3rs3cr3t' in recipes/security.rb — CRITICAL: must be rotated,
            removed from git history, and stored in a secrets manager before migration."
      required:
        - auth_url
        - client_id
        - client_secret
    injectors:
      extra_vars:
        auth_url: !unsafe "{{ auth_url }}"
        client_id: !unsafe "{{ client_id }}"
        client_secret: !unsafe "{{ client_secret }}"
  - name: OAuth Token Endpoint (fetch_and_parse_token)
    description: Token endpoint URL and extracted token value used by the fetch_and_parse_token custom resource. The endpoint is hardcoded; the parsed token 
      value is sensitive.
    kind: cloud
    inputs:
      fields:
        - id: token_url
          type: string
          label: Token Endpoint URL
          help_text: Full URL for the HTTP GET request to retrieve and parse a token (e.g., https://api.example.com/token_endpoint)
        - id: extracted_token
          type: string
          label: Extracted Token
          secret: true
          help_text: "Token value extracted from the response body using pattern 'pattern1:(.+)'. Stored in node.run_state['extracted_token']. NOTE: the regex pattern
            appears to be a placeholder — confirm actual pattern with cookbook maintainer before migration."
      required:
        - token_url
    injectors:
      extra_vars:
        token_url: !unsafe "{{ token_url }}"
        extracted_token: !unsafe "{{ extracted_token }}"
  - name: CyberArk Conjur Connection
    description: Connection parameters for authenticating to the CyberArk Conjur appliance, used by the cyberark-conjur cookbook to retrieve secrets at converge
      time.
    kind: cloud
    inputs:
      fields:
        - id: appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: Base URL of the CyberArk Conjur appliance (node['cyberark']['conjur']['appliance_url'] = https://conjur.example.com)
        - id: account
          type: string
          label: Conjur Account
          help_text: Conjur organization account name (node['cyberark']['conjur']['account'] = myorg)
        - id: host_identity
          type: string
          label: Conjur Host Identity
          help_text: Conjur host identity (host ID) configured on the node for authentication. Not visible in cookbook attributes but required by the 
            cyberark-conjur cookbook.
        - id: host_api_key
          type: string
          label: Conjur Host API Key
          secret: true
          help_text: API key associated with the Conjur host identity. Required to authenticate to the Conjur appliance and retrieve the ssl_passphrase 
            variable.
      required:
        - appliance_url
        - account
        - host_identity
        - host_api_key
    injectors:
      extra_vars:
        appliance_url: !unsafe "{{ appliance_url }}"
        account: !unsafe "{{ account }}"
        host_identity: !unsafe "{{ host_identity }}"
        host_api_key: !unsafe "{{ host_api_key }}"
