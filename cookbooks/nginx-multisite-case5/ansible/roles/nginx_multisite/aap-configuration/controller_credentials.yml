---
controller_credentials:
  - name: CyberArk Conjur SSL Passphrase - nginx_multisite
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used when generating self-signed TLS certificates for all three nginx 
      virtual hosts.
    organization: Default
    credential_type: CyberArk Conjur SSL Passphrase
    update_secrets: true
    inputs:
      conjur_appliance_url: "{{ conjur_appliance_url }}"
      conjur_account: "{{ conjur_account }}"
      conjur_variable_path: "{{ conjur_variable_path }}"
      conjur_api_key: "{{ vault_conjur_api_key }}"
      ssl_passphrase: "{{ vault_ssl_passphrase }}"
  - name: OAuth2 Client Credentials - nginx_multisite
    description: OAuth2 client credentials used to obtain a bearer access token from the auth endpoint. Currently hardcoded in recipes/security.rb and must be 
      migrated to a secrets manager before deployment.
    organization: Default
    credential_type: OAuth2 Client Credentials
    update_secrets: true
    inputs:
      oauth_token_url: "{{ oauth_token_url }}"
      oauth_client_id: "{{ oauth_client_id }}"
      oauth_client_secret: "{{ vault_oauth_client_secret }}"
  - name: API Token Endpoint - nginx_multisite
    description: Runtime-fetched token from an undocumented API endpoint, parsed via regex from the response body. The endpoint may require authentication 
      headers not visible in the source. Downstream consumer is unknown.
    organization: Default
    credential_type: API Token Endpoint
    update_secrets: true
    inputs:
      api_token_url: "{{ api_token_url }}"
      api_token_parse_pattern: "{{ api_token_parse_pattern }}"
      api_auth_header: "{{ vault_api_auth_header }}"
