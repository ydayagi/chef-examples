---
controller_credentials:
  - name: CyberArk Conjur SSL Passphrase - nginx_multisite
    description: CyberArk Conjur credential for retrieving the SSL key passphrase used to generate self-signed TLS certificates for all three nginx virtual 
      hosts.
    organization: Default
    credential_type: CyberArk Conjur SSL Passphrase
    update_secrets: true
    inputs:
      conjur_appliance_url: "{{ conjur_appliance_url }}"
      conjur_account: "{{ conjur_account }}"
      conjur_variable_path: "{{ conjur_variable_path }}"
      conjur_api_key: "{{ vault_conjur_api_key }}"
      ssl_passphrase: "{{ vault_ssl_passphrase }}"
  - name: OAuth2 Client Credentials (fetch_token) - nginx_multisite
    description: OAuth2 client credentials used by the fetch_token custom resource to obtain an access token from the OAuth token endpoint. Currently hardcoded 
      in recipes/security.rb — must be migrated to a secrets manager.
    organization: Default
    credential_type: OAuth2 Client Credentials (fetch_token)
    update_secrets: true
    inputs:
      auth_url: "{{ auth_url }}"
      client_id: "{{ client_id }}"
      client_secret: "{{ vault_client_secret }}"
  - name: OAuth Token Endpoint (fetch_and_parse_token) - nginx_multisite
    description: Token endpoint URL and extracted token value used by the fetch_and_parse_token custom resource. The endpoint is hardcoded; the parsed token 
      value is sensitive.
    organization: Default
    credential_type: OAuth Token Endpoint (fetch_and_parse_token)
    update_secrets: true
    inputs:
      token_url: "{{ token_url }}"
      extracted_token: "{{ vault_extracted_token }}"
  - name: CyberArk Conjur Connection - nginx_multisite
    description: Connection parameters for authenticating to the CyberArk Conjur appliance, used by the cyberark-conjur cookbook to retrieve secrets at converge
      time.
    organization: Default
    credential_type: CyberArk Conjur Connection
    update_secrets: true
    inputs:
      appliance_url: "{{ appliance_url }}"
      account: "{{ account }}"
      host_identity: "{{ host_identity }}"
      host_api_key: "{{ vault_host_api_key }}"
