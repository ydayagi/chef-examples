---
argument_specs:
  main:
    short_description: Install and configure nginx as a multi-site SSL web server with host hardening
    description:
      - Installs and configures nginx to serve multiple SSL-enabled virtual hosts.
      - Hardens the host with fail2ban, UFW firewall, sysctl kernel parameters, and SSH daemon settings.
      - Generates self-signed TLS certificates for each configured virtual host.
      - Fetches an OAuth access token from a configurable endpoint.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: >-
          Dictionary of virtual host configurations keyed by server name.
          Each entry must have document_root (str) and ssl_enabled (bool).
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates (.crt files) are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys (.key files) are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure fail2ban intrusion prevention.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall rules (deny-by-default, allow 22/80/443).
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to set PermitRootLogin no in /etc/ssh/sshd_config.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: >-
          Whether to allow SSH password authentication. When false (default),
          PasswordAuthentication no is set in /etc/ssh/sshd_config.
      nginx_multisite_oauth_auth_url:
        type: str
        required: false
        default: "{{ oauth_token_url }}"
        description: OAuth2 token endpoint URL for fetching an access token.
      nginx_multisite_oauth_client_id:
        type: str
        required: false
        default: "{{ oauth_client_id }}"
        description: OAuth2 client ID used when requesting an access token.
      nginx_multisite_api_token_url:
        type: str
        required: false
        default: "{{ api_token_url }}"
        description: API token endpoint URL (see fetch_and_parse_token note in security.yml).
      nginx_multisite_api_token_parse_pattern:
        type: str
        required: false
        default: "{{ api_token_parse_pattern }}"
        description: Regex pattern used to extract the token from the API response body.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Controls no_log on tasks that handle secret credentials (ssl_passphrase,
          oauth_client_secret, api_auth_header). Set to false only for debugging.
      ssl_passphrase:
        type: str
        required: true
        description: >-
          Passphrase used when generating self-signed TLS private keys with openssl.
          Injected at runtime by the AAP credential type — do not set in playbooks.
      oauth_client_secret:
        type: str
        required: true
        description: >-
          OAuth2 client secret for the token endpoint POST request.
          Injected at runtime by the AAP credential type — do not set in playbooks.
      oauth_token_url:
        type: str
        required: true
        description: >-
          OAuth2 token endpoint URL injected by the AAP credential type.
      oauth_client_id:
        type: str
        required: true
        description: >-
          OAuth2 client ID injected by the AAP credential type.
      api_token_url:
        type: str
        required: true
        description: >-
          API token endpoint URL injected by the AAP credential type.
      api_token_parse_pattern:
        type: str
        required: true
        description: >-
          Regex pattern for parsing the API token response, injected by the AAP credential type.
      api_auth_header:
        type: str
        required: true
        description: >-
          Authentication header value for the API token endpoint.
          Injected at runtime by the AAP credential type — do not set in playbooks.
      conjur_appliance_url:
        type: str
        required: true
        description: >-
          CyberArk Conjur appliance URL injected by the AAP credential type.
      conjur_account:
        type: str
        required: true
        description: >-
          CyberArk Conjur account name injected by the AAP credential type.
      conjur_variable_path:
        type: str
        required: true
        description: >-
          CyberArk Conjur variable path injected by the AAP credential type.
      conjur_api_key:
        type: str
        required: true
        description: >-
          CyberArk Conjur API key injected by the AAP credential type — do not set in playbooks.
