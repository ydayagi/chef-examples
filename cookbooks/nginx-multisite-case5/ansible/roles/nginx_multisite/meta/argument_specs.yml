---
argument_specs:
  main:
    short_description: Install and configure nginx as a multi-site SSL-enabled web server
    description:
      - Installs and configures nginx to host multiple SSL-enabled virtual hosts.
      - Hardens the host with fail2ban, UFW firewall rules, and kernel sysctl security parameters.
      - Generates self-signed TLS certificates for each configured site.
      - Enforces SSH hardening via sshd_config modifications.
    options:
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Controls no_log for tasks that handle secret credentials (ssl_passphrase,
          client_secret, extracted_token). Set to false only for debugging.
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: >-
          Dictionary of virtual host sites to configure. Each key is the server_name
          (FQDN) and the value is a dict with document_root and ssl_enabled keys.
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates (.crt files) are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys (.key files) are stored.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure fail2ban intrusion prevention.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall rules (deny default, allow SSH/HTTP/HTTPS).
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to set PermitRootLogin no in /etc/ssh/sshd_config.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: >-
          Whether to allow SSH password authentication. When false (default),
          PasswordAuthentication no is enforced in /etc/ssh/sshd_config.
      nginx_multisite_auth_url:
        type: str
        required: false
        default: "{{ auth_url }}"
        description: OAuth2 token endpoint URL for the fetch_token operation.
      nginx_multisite_client_id:
        type: str
        required: false
        default: "{{ client_id }}"
        description: OAuth2 client ID used when fetching the access token.
      nginx_multisite_token_url:
        type: str
        required: false
        default: "{{ token_url }}"
        description: URL for the token endpoint used by fetch_and_parse_token.
      # AAP credential-injected variables (required, no defaults)
      ssl_passphrase:
        type: str
        required: true
        description: >-
          Passphrase for the RSA private key used when generating self-signed TLS
          certificates. Injected at runtime by the AAP CyberArk Conjur credential type.
      client_secret:
        type: str
        required: true
        description: >-
          OAuth2 client secret used when fetching the access token from auth_url.
          Injected at runtime by the AAP credential type.
      extracted_token:
        type: str
        required: true
        description: >-
          Token value extracted from the token_url endpoint response.
          Injected at runtime by the AAP credential type.
      conjur_api_key:
        type: str
        required: true
        description: >-
          CyberArk Conjur API key for authenticating to the Conjur appliance.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      host_api_key:
        type: str
        required: true
        description: >-
          CyberArk Conjur host API key for host identity authentication.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      conjur_appliance_url:
        type: str
        required: true
        description: >-
          URL of the CyberArk Conjur appliance.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      conjur_account:
        type: str
        required: true
        description: >-
          CyberArk Conjur account name.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      conjur_variable_path:
        type: str
        required: true
        description: >-
          Path to the variable in CyberArk Conjur to retrieve.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      auth_url:
        type: str
        required: true
        description: >-
          Raw OAuth2 token endpoint URL injected by the AAP credential type.
          Consumed by the nginx_multisite_auth_url default.
      client_id:
        type: str
        required: true
        description: >-
          Raw OAuth2 client ID injected by the AAP credential type.
          Consumed by the nginx_multisite_client_id default.
      token_url:
        type: str
        required: true
        description: >-
          Raw token URL injected by the AAP credential type.
          Consumed by the nginx_multisite_token_url default.
      appliance_url:
        type: str
        required: true
        description: >-
          Conjur appliance URL (alternate form) injected by the AAP credential type.
          Validated by validate_credentials.yml.
      account:
        type: str
        required: true
        description: >-
          Conjur account (alternate form) injected by the AAP credential type.
          Validated by validate_credentials.yml.
      host_identity:
        type: str
        required: true
        description: >-
          Conjur host identity injected by the AAP credential type.
          Validated by validate_credentials.yml.
