---
# Play 1: Verify nginx configuration files and virtual host setup
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat nginx core config files
      ansible.builtin.stat:
        path: "{{ item_nginx_conf }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_nginx_conf
      register: nginx_conf_stat_results

    - name: Assert nginx core config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_nginx_conf_result['stat']['exists']
          - item_nginx_conf_result['stat']['size'] > 0
        fail_msg: "Expected nginx config file not found or empty"
      loop: "{{ nginx_conf_stat_results['results'] }}"
      loop_control:
        loop_var: item_nginx_conf_result

    - name: Stat nginx sites-available config files
      ansible.builtin.stat:
        path: "{{ item_site_avail }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_avail
      register: sites_available_stat_results

    - name: Assert nginx sites-available config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_site_avail_result['stat']['exists']
          - item_site_avail_result['stat']['size'] > 0
        fail_msg: "Expected sites-available config file not found or empty"
      loop: "{{ sites_available_stat_results['results'] }}"
      loop_control:
        loop_var: item_site_avail_result

    - name: Stat nginx sites-enabled symlinks
      ansible.builtin.stat:
        path: "{{ item_site_enabled }}"
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_enabled
      register: sites_enabled_stat_results

    - name: Assert nginx sites-enabled symlinks exist and are symlinks
      ansible.builtin.assert:
        that:
          - item_site_enabled_result['stat']['exists']
          - item_site_enabled_result['stat']['islnk']
        fail_msg: "Expected sites-enabled symlink not found or not a symlink"
      loop: "{{ sites_enabled_stat_results['results'] }}"
      loop_control:
        loop_var: item_site_enabled_result

    - name: Stat default nginx placeholder site
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_default_site_stat

    - name: Assert default nginx placeholder site is absent
      ansible.builtin.assert:
        that:
          - not nginx_default_site_stat['stat']['exists']
        fail_msg: "Default nginx placeholder site should have been removed"

    - name: Slurp nginx.conf to verify key directives
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'sites-enabled' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "nginx.conf is missing expected directives"

    - name: Slurp security.conf to verify rate-limit and SSL directives
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'server_tokens off' in (security_conf_content['content'] | b64decode)"
          - "'TLSv1.2' in (security_conf_content['content'] | b64decode)"
        fail_msg: "security.conf is missing expected security directives"

# Play 2: Verify static content files and SSL certificates/keys
- name: Verify static content and SSL certificates
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat site document root index files
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stat_results

    - name: Assert site index.html files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_index_result['stat']['exists']
          - item_index_result['stat']['size'] > 0
        fail_msg: "Expected site index.html not found or empty"
      loop: "{{ index_stat_results['results'] }}"
      loop_control:
        loop_var: item_index_result

    - name: Stat SSL certificate files
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: cert_stat_results

    - name: Assert SSL certificate files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_cert_result['stat']['exists']
          - item_cert_result['stat']['size'] > 0
        fail_msg: "Expected SSL certificate file not found or empty"
      loop: "{{ cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_cert_result

    - name: Stat SSL private key files
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: key_stat_results

    - name: Assert SSL private key files exist with correct mode and ownership
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['exists']
          - item_key_result['stat']['size'] > 0
          - item_key_result['stat']['mode'] == '0640'
          - item_key_result['stat']['pw_name'] == 'root'
          - item_key_result['stat']['gr_name'] == 'ssl-cert'
        fail_msg: "SSL private key file missing, wrong mode, or wrong ownership"
      loop: "{{ key_stat_results['results'] }}"
      loop_control:
        loop_var: item_key_result

    - name: Stat site document root directories
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert site document root directories exist with correct ownership
      ansible.builtin.assert:
        that:
          - item_docroot_result['stat']['exists']
          - item_docroot_result['stat']['isdir']
          - item_docroot_result['stat']['pw_name'] == 'www-data'
          - item_docroot_result['stat']['gr_name'] == 'www-data'
        fail_msg: "Site document root directory missing or wrong ownership"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_docroot_result

# Play 3: Verify security configuration files and SSH hardening
- name: Verify security configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat security config files
      ansible.builtin.stat:
        path: "{{ item_sec_conf }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
        - /etc/ssh/sshd_config
      loop_control:
        loop_var: item_sec_conf
      register: sec_conf_stat_results

    - name: Assert security config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_sec_conf_result['stat']['exists']
          - item_sec_conf_result['stat']['size'] > 0
        fail_msg: "Expected security config file not found or empty"
      loop: "{{ sec_conf_stat_results['results'] }}"
      loop_control:
        loop_var: item_sec_conf_result

    - name: Slurp fail2ban jail.local to verify jail configuration
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: fail2ban_jail_content

    - name: Assert fail2ban jail.local contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'bantime' in (fail2ban_jail_content['content'] | b64decode)"
        fail_msg: "fail2ban jail.local is missing expected jail configuration"

    - name: Slurp sysctl security config to verify kernel hardening parameters
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl security config contains kernel hardening parameters
      ansible.builtin.assert:
        that:
          - "'rp_filter' in (sysctl_conf_content['content'] | b64decode)"
          - "'tcp_syncookies' in (sysctl_conf_content['content'] | b64decode)"
          - "'accept_redirects' in (sysctl_conf_content['content'] | b64decode)"
        fail_msg: "sysctl security config is missing expected kernel hardening parameters"

    - name: Slurp sshd_config to verify SSH hardening
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert sshd_config contains SSH hardening directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config is missing expected SSH hardening directives"

# Play 4: Verify services are running and ports are listening
- name: Verify services and network ports
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
        fail_msg: "nginx service is not running or not enabled"

    - name: Assert fail2ban service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
        fail_msg: "fail2ban service is not running or not enabled"

    - name: Wait for nginx to be listening on port 80
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 30
        state: started

    - name: Wait for nginx to be listening on port 443
      ansible.builtin.wait_for:
        port: 443
        host: 127.0.0.1
        timeout: 30
        state: started

    - name: Check HTTP port 80 returns redirect to HTTPS for test site
      ansible.builtin.uri:
        url: "http://127.0.0.1"
        method: GET
        follow_redirects: none
        status_code: 301
        headers:
          Host: test.cluster.local
      register: http_redirect_result

    - name: Assert HTTP redirect response contains HTTPS location
      ansible.builtin.assert:
        that:
          - "'https' in http_redirect_result['location']"
        fail_msg: "HTTP port 80 did not return expected HTTPS redirect"
