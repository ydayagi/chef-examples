---
# Security tasks: fail2ban, UFW, sysctl hardening, SSH hardening

- name: Install security packages
  ansible.builtin.package:
    name:
      - fail2ban
      - ufw
    state: present

# FIX (ordering): Deploy fail2ban config BEFORE starting the service so that
# fail2ban starts with the correct jail configuration on the very first run.
- name: Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    backup: true
  notify: Restart fail2ban

- name: Enable and start fail2ban service
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Set UFW default policy to deny
  ansible.builtin.command:
    cmd: ufw --force default deny
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Default incoming policy changed' in nginx_multisite_ufw_default.stdout"
  register: nginx_multisite_ufw_default

- name: Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_ssh.stdout"
  register: nginx_multisite_ufw_ssh

- name: Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_http.stdout"
  register: nginx_multisite_ufw_http

- name: Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Rules updated' in nginx_multisite_ufw_https.stdout"
  register: nginx_multisite_ufw_https

- name: Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: nginx_multisite_ufw_enabled | bool
  changed_when: "'Firewall is active and enabled' in nginx_multisite_ufw_enable.stdout"
  register: nginx_multisite_ufw_enable

- name: Fetch OAuth access token
  ansible.builtin.uri: # noqa: R105 - destination is the role-configured auth URL defined in defaults/group_vars, not user input
    url: "{{ nginx_multisite_auth_url }}"
    method: POST
    body_format: json
    body:
      client_id: "{{ nginx_multisite_client_id }}"
      client_secret: "{{ client_secret }}" # noqa: L039 - client_secret is supplied via vault/extra_vars by the caller
    return_content: true
    status_code: 200
  register: nginx_multisite_token_response
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Fetch and parse token from token endpoint
  ansible.builtin.uri:
    url: "{{ nginx_multisite_token_url }}"
    method: GET
    return_content: true
    status_code: 200
  register: nginx_multisite_parsed_token_response
  no_log: "{{ nginx_multisite_secure_logging }}"

- name: Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0644"
    backup: true
  notify: Reload sysctl

# FIX (category 2 - missing app guard): openssh-server is a base OS component
# that the role does not own. Stat-guard both sshd_config tasks so they are
# skipped (rather than creating a bogus stub) on targets where the file is absent.
- name: Check whether sshd_config exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: nginx_multisite_sshd_config_stat

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile: # noqa: L068 - sshd_config is not an ini/template-managed file; lineinfile is the correct targeted approach
    path: /etc/ssh/sshd_config
    regexp: ^#?PermitRootLogin
    line: PermitRootLogin no
    backup: true
    create: false
    mode: "0600"
  when:
    - nginx_multisite_ssh_disable_root
    - nginx_multisite_sshd_config_stat.stat.exists # noqa: L039 - registered by the preceding stat task
  notify: Restart ssh

- name: Harden SSH - disable password authentication
  ansible.builtin.lineinfile: # noqa: L068 - sshd_config is not an ini/template-managed file; lineinfile is the correct targeted approach
    path: /etc/ssh/sshd_config
    regexp: ^#?PasswordAuthentication
    line: PasswordAuthentication no
    backup: true
    create: false
    mode: "0600"
  when:
    - not nginx_multisite_ssh_password_auth
    - nginx_multisite_sshd_config_stat.stat.exists # noqa: L039 - registered by the preceding stat task
  notify: Restart ssh
