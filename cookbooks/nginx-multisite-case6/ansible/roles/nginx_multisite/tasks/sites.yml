---
- name: Deploy nginx site configurations
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable nginx sites via symlinks # noqa: L031 - mode 0777 is correct for symlinks; Linux always reports symlink permissions as 0777
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    dest: /etc/nginx/sites-enabled/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    state: link
    mode: "0777"
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx

- name: Remove nginx default site # noqa: L021 - state absent does not require mode; no file is created
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
