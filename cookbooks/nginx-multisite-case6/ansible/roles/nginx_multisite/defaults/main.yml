---
# nginx sites configuration
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
# SSL certificate paths
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
# Security settings
nginx_multisite_security_fail2ban_enabled: true
nginx_multisite_security_ufw_enabled: true
nginx_multisite_security_ssh_disable_root: true
nginx_multisite_security_ssh_password_auth: false
# OAuth token endpoint settings
nginx_multisite_auth_url: "{{ auth_url }}"
nginx_multisite_client_id: "{{ client_id }}"
nginx_multisite_token_url: "{{ token_url }}"
nginx_multisite_platform_scope: "{{ platform_scope }}"
# Company app config file
nginx_multisite_company_app_conf: /etc/company/app.conf
# Secure logging toggle (set to false only for debugging)
nginx_multisite_secure_logging: true
