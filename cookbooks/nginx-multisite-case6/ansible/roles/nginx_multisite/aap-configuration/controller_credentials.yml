---
controller_credentials:
  - name: CyberArk Conjur SSL Passphrase - nginx_multisite
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used during self-signed certificate generation for all three nginx 
      virtual hosts.
    organization: Default
    credential_type: CyberArk Conjur SSL Passphrase
    update_secrets: true
    inputs:
      conjur_appliance_url: "{{ conjur_appliance_url }}"
      conjur_account: "{{ conjur_account }}"
      conjur_variable_path: "{{ conjur_variable_path }}"
      conjur_api_token: "{{ vault_conjur_api_token }}"
      ssl_passphrase: "{{ vault_ssl_passphrase }}"
  - name: OAuth2 Client Credentials - nginx_multisite
    description: OAuth2 client credentials used by the fetch_token custom resource to obtain an access token from the internal OAuth2 token endpoint. The 
      client_secret was previously hardcoded as 'sup3rs3cr3t' and must be rotated and stored securely before migration.
    organization: Default
    credential_type: OAuth2 Client Credentials
    update_secrets: true
    inputs:
      auth_url: "{{ auth_url }}"
      client_id: "{{ client_id }}"
      client_secret: "{{ vault_client_secret }}"
  - name: Company Internal Service API Key - nginx_multisite
    description: Service API key for the nginx scope retrieved from the internal Company Secrets Platform via the proprietary company_internal_lib Ruby gem 
      (CompanyInternal::SettingsStore). The underlying platform and Ansible equivalent are undocumented and must be confirmed with the internal platform team 
      before migration.
    organization: Default
    credential_type: Company Internal Service API Key
    update_secrets: true
    inputs:
      service_api_key: "{{ vault_service_api_key }}"
      platform_scope: "{{ platform_scope }}"
  - name: Internal API Parsed Token - nginx_multisite
    description: Token retrieved at runtime from an internal API endpoint (https://api.example.com/token_endpoint) via HTTP GET and extracted from the response 
      body using a regex pattern. The regex pattern1:(.+) and the endpoint semantics are undocumented placeholders — must be confirmed with the owning team 
      before migration.
    organization: Default
    credential_type: Internal API Parsed Token
    update_secrets: true
    inputs:
      token_url: "{{ token_url }}"
      extracted_token: "{{ vault_extracted_token }}"
