---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used during self-signed certificate generation for all three nginx 
      virtual hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: Conjur organization account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: Path to the secret variable in Conjur (e.g., production/nginx/ssl_passphrase)
        - id: conjur_api_token
          type: string
          label: Conjur API Token
          secret: true
          help_text: API token used to authenticate with the CyberArk Conjur appliance
        - id: ssl_passphrase
          type: string
          label: SSL Passphrase
          secret: true
          help_text: The SSL private key passphrase retrieved from Conjur at path production/nginx/ssl_passphrase; passed as -passout to openssl req when 
            generating self-signed certificates
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - conjur_api_token
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        conjur_api_token: !unsafe "{{ conjur_api_token }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
  - name: OAuth2 Client Credentials
    description: OAuth2 client credentials used by the fetch_token custom resource to obtain an access token from the internal OAuth2 token endpoint. The 
      client_secret was previously hardcoded as 'sup3rs3cr3t' and must be rotated and stored securely before migration.
    kind: cloud
    inputs:
      fields:
        - id: auth_url
          type: string
          label: OAuth Token Endpoint URL
          help_text: URL of the OAuth2 token endpoint (e.g., https://auth.example.com/oauth/token)
        - id: client_id
          type: string
          label: Client ID
          help_text: OAuth2 client identifier (e.g., nginx-multisite)
        - id: client_secret
          type: string
          label: Client Secret
          secret: true
          help_text: OAuth2 client secret used in the JSON POST body to obtain an access token. Previously hardcoded as 'sup3rs3cr3t' — must be rotated and 
            stored in a secrets manager before migration.
      required:
        - auth_url
        - client_id
        - client_secret
    injectors:
      extra_vars:
        auth_url: !unsafe "{{ auth_url }}"
        client_id: !unsafe "{{ client_id }}"
        client_secret: !unsafe "{{ client_secret }}"
  - name: Company Internal Service API Key
    description: Service API key for the nginx scope retrieved from the internal Company Secrets Platform via the proprietary company_internal_lib Ruby gem 
      (CompanyInternal::SettingsStore). The underlying platform and Ansible equivalent are undocumented and must be confirmed with the internal platform team 
      before migration.
    kind: cloud
    inputs:
      fields:
        - id: service_api_key
          type: string
          label: Service API Key
          secret: true
          help_text: API key scoped to 'nginx' retrieved from the internal Company Secrets Platform. Stored in node.run_state['service_api_key']. Downstream 
            consumer is not documented within this cookbook.
        - id: platform_scope
          type: string
          label: Secrets Platform Scope
          help_text: Scope identifier used when querying the internal secrets platform (e.g., 'nginx')
      required:
        - service_api_key
    injectors:
      extra_vars:
        service_api_key: !unsafe "{{ service_api_key }}"
        platform_scope: !unsafe "{{ platform_scope }}"
  - name: Internal API Parsed Token
    description: Token retrieved at runtime from an internal API endpoint (https://api.example.com/token_endpoint) via HTTP GET and extracted from the response 
      body using a regex pattern. The regex pattern1:(.+) and the endpoint semantics are undocumented placeholders — must be confirmed with the owning team 
      before migration.
    kind: cloud
    inputs:
      fields:
        - id: token_url
          type: string
          label: Token Endpoint URL
          help_text: "URL of the internal API token endpoint (e.g., https://api.example.com/token_endpoint). Note: this may be a placeholder — confirm the real URL
            with the team."
        - id: extracted_token
          type: string
          label: Extracted Token
          secret: true
          help_text: Token value parsed from the HTTP GET response body using regex pattern1:(.+). Stored in node.run_state['extracted_token']. The actual regex
            pattern and response format are undocumented — treat as a placeholder.
      required:
        - token_url
    injectors:
      extra_vars:
        token_url: !unsafe "{{ token_url }}"
        extracted_token: !unsafe "{{ extracted_token }}"
