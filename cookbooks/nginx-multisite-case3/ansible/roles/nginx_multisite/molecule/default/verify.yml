---
# Play 1: Service status verification
- name: Verify services are running
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
        fail_msg: "nginx service is not running or not enabled"

    - name: Assert fail2ban service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
        fail_msg: "fail2ban service is not running or not enabled"

# Play 2: Nginx configuration file checks
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat nginx configuration files
      ansible.builtin.stat:
        path: "{{ item_config }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_config
      register: nginx_config_stat_results

    - name: Assert nginx configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isreg']
          - item_result['stat']['size'] > 0
        fail_msg: "Expected nginx config file does not exist or is empty"
      loop: "{{ nginx_config_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Slurp nginx.conf to verify key directives
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'sites-enabled' in (nginx_conf_content['content'] | b64decode)"
          - "'gzip' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "nginx.conf is missing expected directives"

    - name: Slurp security.conf to verify rate limiting and SSL settings
      ansible.builtin.slurp:
        src: /etc/nginx/conf.d/security.conf
      register: security_conf_content

    - name: Assert security.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'server_tokens' in (security_conf_content['content'] | b64decode)"
          - "'TLSv1.2' in (security_conf_content['content'] | b64decode)"
          - "'limit_req_zone' in (security_conf_content['content'] | b64decode)"
        fail_msg: "security.conf is missing expected directives"

    - name: Slurp each site config to verify SSL and redirect directives
      ansible.builtin.slurp:
        src: "{{ item_site_conf }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_conf
      register: site_conf_slurp_results

    - name: Assert each site config contains SSL and redirect directives
      ansible.builtin.assert:
        that:
          - "'ssl_certificate' in (item_result['content'] | b64decode)"
          - "'return 301' in (item_result['content'] | b64decode)"
          - "'TLSv1.2' in (item_result['content'] | b64decode)"
          - "'Strict-Transport-Security' in (item_result['content'] | b64decode)"
        fail_msg: "Site config is missing expected SSL or redirect directives"
      loop: "{{ site_conf_slurp_results['results'] }}"
      loop_control:
        loop_var: item_result

# Play 3: Symlinks, default site removal, document roots, and static files
- name: Verify symlinks, document roots, and static files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat sites-enabled symlinks
      ansible.builtin.stat:
        path: "{{ item_symlink }}"
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_symlink
      register: symlink_stat_results

    - name: Assert sites-enabled symlinks exist and are symlinks
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['islnk']
        fail_msg: "Expected sites-enabled symlink does not exist or is not a symlink"
      loop: "{{ symlink_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat default nginx site (must NOT exist)
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_default_site_stat

    - name: Assert default nginx site has been removed
      ansible.builtin.assert:
        that:
          - not nginx_default_site_stat['stat']['exists']
        fail_msg: "Default nginx site still exists in sites-enabled — it should have been removed"

    - name: Stat site index.html static files
      ansible.builtin.stat:
        path: "{{ item_html }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_html
      register: html_stat_results

    - name: Assert site index.html files exist with correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isreg']
          - item_result['stat']['size'] > 0
          - item_result['stat']['pw_name'] == 'www-data'
          - item_result['stat']['gr_name'] == 'www-data'
          - item_result['stat']['mode'] == '0644'
        fail_msg: "Site index.html file missing, wrong owner, or wrong permissions"
      loop: "{{ html_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

# Play 4: SSL certificates, keys, security configs, and SSH hardening
- name: Verify SSL certificates, keys, and security configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat SSL certificate files
      ansible.builtin.stat:
        path: "{{ item_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_cert
      register: ssl_cert_stat_results

    - name: Assert SSL certificate files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isreg']
          - item_result['stat']['size'] > 0
        fail_msg: "SSL certificate file does not exist or is empty"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat SSL private key files
      ansible.builtin.stat:
        path: "{{ item_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_key
      register: ssl_key_stat_results

    - name: Assert SSL private key files exist with correct permissions
      ansible.builtin.assert:
        that:
          - item_result['stat']['exists']
          - item_result['stat']['isreg']
          - item_result['stat']['size'] > 0
          - item_result['stat']['pw_name'] == 'root'
          - item_result['stat']['gr_name'] == 'ssl-cert'
          - item_result['stat']['mode'] == '0640'
        fail_msg: "SSL private key file missing, wrong owner, or wrong permissions"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_result

    - name: Stat fail2ban jail configuration
      ansible.builtin.stat:
        path: /etc/fail2ban/jail.local
      register: fail2ban_jail_stat

    - name: Assert fail2ban jail.local exists
      ansible.builtin.assert:
        that:
          - fail2ban_jail_stat['stat']['exists']
          - fail2ban_jail_stat['stat']['isreg']
          - fail2ban_jail_stat['stat']['size'] > 0
        fail_msg: "fail2ban jail.local configuration file does not exist or is empty"

    - name: Slurp fail2ban jail.local to verify jail definitions
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: fail2ban_jail_content

    - name: Assert fail2ban jail.local contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'[nginx-limit-req]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'[nginx-botsearch]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'bantime' in (fail2ban_jail_content['content'] | b64decode)"
        fail_msg: "fail2ban jail.local is missing expected jail definitions"

    - name: Stat sysctl security configuration
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-security.conf
      register: sysctl_conf_stat

    - name: Assert sysctl security configuration exists
      ansible.builtin.assert:
        that:
          - sysctl_conf_stat['stat']['exists']
          - sysctl_conf_stat['stat']['isreg']
          - sysctl_conf_stat['stat']['size'] > 0
        fail_msg: "sysctl security configuration /etc/sysctl.d/99-security.conf does not exist"

    - name: Slurp sysctl security configuration to verify hardening settings
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl security configuration contains hardening parameters
      ansible.builtin.assert:
        that:
          - "'rp_filter' in (sysctl_conf_content['content'] | b64decode)"
          - "'syncookies' in (sysctl_conf_content['content'] | b64decode)"
          - "'icmp_echo_ignore_all' in (sysctl_conf_content['content'] | b64decode)"
        fail_msg: "sysctl security configuration is missing expected hardening parameters"

    - name: Slurp sshd_config to verify SSH hardening
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert sshd_config contains SSH hardening directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config is missing expected SSH hardening directives"

# Play 5: Port availability checks
- name: Verify nginx is listening on expected ports
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for nginx to be listening on port 80
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 80
        state: started
        timeout: 10

    - name: Wait for nginx to be listening on port 443
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 443
        state: started
        timeout: 10

    - name: Verify HTTP redirects to HTTPS for test.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: test.cluster.local
        follow_redirects: none
        status_code: 301
      register: test_http_redirect

    - name: Assert HTTP redirect response contains HTTPS location
      ansible.builtin.assert:
        that:
          - "'https://test.cluster.local' in test_http_redirect['location']"
        fail_msg: "HTTP did not redirect to HTTPS for test.cluster.local"

    - name: Verify HTTP redirects to HTTPS for ci.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: ci.cluster.local
        follow_redirects: none
        status_code: 301
      register: ci_http_redirect

    - name: Assert HTTP redirect response contains HTTPS location for ci
      ansible.builtin.assert:
        that:
          - "'https://ci.cluster.local' in ci_http_redirect['location']"
        fail_msg: "HTTP did not redirect to HTTPS for ci.cluster.local"

    - name: Verify HTTP redirects to HTTPS for status.cluster.local
      ansible.builtin.uri:
        url: http://localhost/
        headers:
          Host: status.cluster.local
        follow_redirects: none
        status_code: 301
      register: status_http_redirect

    - name: Assert HTTP redirect response contains HTTPS location for status
      ansible.builtin.assert:
        that:
          - "'https://status.cluster.local' in status_http_redirect['location']"
        fail_msg: "HTTP did not redirect to HTTPS for status.cluster.local"
