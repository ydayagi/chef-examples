---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL certificate passphrase used when generating self-signed TLS certificates for all three nginx 
      virtual hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: Conjur account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: Path to the SSL passphrase variable in Conjur (e.g., production/nginx/ssl_passphrase)
        - id: ssl_passphrase
          type: string
          label: SSL Passphrase
          secret: true
          help_text: The SSL private key passphrase retrieved from Conjur at runtime; passed as -passout to openssl req when generating self-signed certificates
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - ssl_passphrase
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
  - name: OAuth2 Client Credentials (fetch_token)
    description: OAuth2 client credentials used by the fetch_token resource to obtain an access token from the auth endpoint. The client_secret is currently 
      hardcoded in recipes/security.rb and must be migrated to a secrets manager.
    kind: cloud
    inputs:
      fields:
        - id: token_endpoint_url
          type: string
          label: Token Endpoint URL
          help_text: OAuth2 token endpoint URL (e.g., https://auth.example.com/oauth/token)
        - id: client_id
          type: string
          label: Client ID
          help_text: OAuth2 client identifier used in the token request body (e.g., nginx-multisite)
        - id: client_secret
          type: string
          label: Client Secret
          secret: true
          help_text: OAuth2 client secret used in the token request body; currently hardcoded as 'sup3rs3cr3t' in recipes/security.rb — must be replaced with a 
            secrets-manager-sourced value before production use
      required:
        - token_endpoint_url
        - client_id
        - client_secret
    injectors:
      extra_vars:
        token_endpoint_url: !unsafe "{{ token_endpoint_url }}"
        client_id: !unsafe "{{ client_id }}"
        client_secret: !unsafe "{{ client_secret }}"
  - name: Parsed Token Endpoint (fetch_and_parse_token)
    description: HTTP endpoint credential used by the fetch_and_parse_token resource to retrieve and parse a token value from a remote API endpoint.
    kind: cloud
    inputs:
      fields:
        - id: token_url
          type: string
          label: Token URL
          help_text: URL of the token parsing endpoint (e.g., https://api.example.com/token_endpoint)
        - id: extracted_token
          type: string
          label: Extracted Token
          secret: true
          help_text: Token value extracted from the HTTP response body by matching the regex pattern 'pattern1:(.+)'; stored in 
            node.run_state['extracted_token']. The actual production pattern should be confirmed with the application team.
      required:
        - token_url
    injectors:
      extra_vars:
        token_url: !unsafe "{{ token_url }}"
        extracted_token: !unsafe "{{ extracted_token }}"
