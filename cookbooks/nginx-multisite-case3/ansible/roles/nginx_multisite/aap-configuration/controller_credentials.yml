---
controller_credentials:
  - name: CyberArk Conjur SSL Passphrase - nginx_multisite
    description: CyberArk Conjur credential for retrieving the SSL certificate passphrase used when generating self-signed TLS certificates for all three nginx 
      virtual hosts.
    organization: Default
    credential_type: CyberArk Conjur SSL Passphrase
    update_secrets: true
    inputs:
      conjur_appliance_url: "{{ conjur_appliance_url }}"
      conjur_account: "{{ conjur_account }}"
      conjur_variable_path: "{{ conjur_variable_path }}"
      ssl_passphrase: "{{ vault_ssl_passphrase }}"
  - name: OAuth2 Client Credentials (fetch_token) - nginx_multisite
    description: OAuth2 client credentials used by the fetch_token resource to obtain an access token from the auth endpoint. The client_secret is currently 
      hardcoded in recipes/security.rb and must be migrated to a secrets manager.
    organization: Default
    credential_type: OAuth2 Client Credentials (fetch_token)
    update_secrets: true
    inputs:
      token_endpoint_url: "{{ token_endpoint_url }}"
      client_id: "{{ client_id }}"
      client_secret: "{{ vault_client_secret }}"
  - name: Parsed Token Endpoint (fetch_and_parse_token) - nginx_multisite
    description: HTTP endpoint credential used by the fetch_and_parse_token resource to retrieve and parse a token value from a remote API endpoint.
    organization: Default
    credential_type: Parsed Token Endpoint (fetch_and_parse_token)
    update_secrets: true
    inputs:
      token_url: "{{ token_url }}"
      extracted_token: "{{ vault_extracted_token }}"
