---
# ---------------------------------------------------------------------------
# Play 1: Verify services are running
# ---------------------------------------------------------------------------
- name: Verify services
  hosts: all
  gather_facts: false
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert nginx service is active and enabled
      ansible.builtin.assert:
        that:
          - "'nginx.service' in ansible_facts['services']"
          - "ansible_facts['services']['nginx.service']['state'] == 'running'"
          - "ansible_facts['services']['nginx.service']['status'] == 'enabled'"
        fail_msg: "nginx service is not running or not enabled"

    - name: Assert fail2ban service is active and enabled
      ansible.builtin.assert:
        that:
          - "'fail2ban.service' in ansible_facts['services']"
          - "ansible_facts['services']['fail2ban.service']['state'] == 'running'"
          - "ansible_facts['services']['fail2ban.service']['status'] == 'enabled'"
        fail_msg: "fail2ban service is not running or not enabled"

    - name: Check nginx is listening on port 80
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        timeout: 10
        state: started

    - name: Check nginx is listening on port 443
      ansible.builtin.wait_for:
        port: 443
        host: 127.0.0.1
        timeout: 10
        state: started

# ---------------------------------------------------------------------------
# Play 2: Verify nginx configuration files
# ---------------------------------------------------------------------------
- name: Verify nginx configuration files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat nginx configuration files
      ansible.builtin.stat:
        path: "{{ item_nginx_conf }}"
      loop:
        - /etc/nginx/nginx.conf
        - /etc/nginx/conf.d/security.conf
      loop_control:
        loop_var: item_nginx_conf
      register: nginx_conf_stat_results

    - name: Assert nginx configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_nginx_result['stat']['exists']
          - item_nginx_result['stat']['size'] > 0
          - item_nginx_result['stat']['isreg']
        fail_msg: "Expected nginx config file not found or empty"
      loop: "{{ nginx_conf_stat_results['results'] }}"
      loop_control:
        loop_var: item_nginx_result

    - name: Stat nginx site config files (sites-available)
      ansible.builtin.stat:
        path: "{{ item_site_conf }}"
      loop:
        - /etc/nginx/sites-available/test.cluster.local
        - /etc/nginx/sites-available/ci.cluster.local
        - /etc/nginx/sites-available/status.cluster.local
      loop_control:
        loop_var: item_site_conf
      register: nginx_site_conf_stat_results

    - name: Assert nginx site config files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_site_result['stat']['exists']
          - item_site_result['stat']['size'] > 0
          - item_site_result['stat']['isreg']
        fail_msg: "Expected nginx site config file not found or empty"
      loop: "{{ nginx_site_conf_stat_results['results'] }}"
      loop_control:
        loop_var: item_site_result

    - name: Stat nginx sites-enabled symlinks
      ansible.builtin.stat:
        path: "{{ item_site_link }}"
      loop:
        - /etc/nginx/sites-enabled/test.cluster.local
        - /etc/nginx/sites-enabled/ci.cluster.local
        - /etc/nginx/sites-enabled/status.cluster.local
      loop_control:
        loop_var: item_site_link
      register: nginx_site_link_stat_results

    - name: Assert nginx sites-enabled symlinks exist and are symlinks
      ansible.builtin.assert:
        that:
          - item_link_result['stat']['exists']
          - item_link_result['stat']['islnk']
        fail_msg: "Expected nginx sites-enabled symlink not found"
      loop: "{{ nginx_site_link_stat_results['results'] }}"
      loop_control:
        loop_var: item_link_result

    - name: Stat default nginx site (must NOT exist)
      ansible.builtin.stat:
        path: /etc/nginx/sites-enabled/default
      register: nginx_default_site_stat

    - name: Assert default nginx site has been removed
      ansible.builtin.assert:
        that:
          - not nginx_default_site_stat['stat']['exists']
        fail_msg: "Default nginx site should have been removed but still exists"

    - name: Slurp nginx.conf to verify key directives
      ansible.builtin.slurp:
        src: /etc/nginx/nginx.conf
      register: nginx_conf_content

    - name: Assert nginx.conf contains expected directives
      ansible.builtin.assert:
        that:
          - "'worker_processes' in (nginx_conf_content['content'] | b64decode)"
          - "'sites-enabled' in (nginx_conf_content['content'] | b64decode)"
        fail_msg: "nginx.conf is missing expected directives"

    - name: Slurp a site config to verify SSL and security headers
      ansible.builtin.slurp:
        src: /etc/nginx/sites-available/test.cluster.local
      register: test_site_conf_content

    - name: Assert test.cluster.local site config has SSL and security headers
      ansible.builtin.assert:
        that:
          - "'ssl_certificate' in (test_site_conf_content['content'] | b64decode)"
          - "'TLSv1.2' in (test_site_conf_content['content'] | b64decode)"
          - "'X-Frame-Options' in (test_site_conf_content['content'] | b64decode)"
          - "'Strict-Transport-Security' in (test_site_conf_content['content'] | b64decode)"
        fail_msg: "test.cluster.local site config is missing SSL or security header directives"

# ---------------------------------------------------------------------------
# Play 3: Verify SSL certificates and private keys
# ---------------------------------------------------------------------------
- name: Verify SSL certificates and private keys
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat SSL certificate files
      ansible.builtin.stat:
        path: "{{ item_ssl_cert }}"
      loop:
        - /etc/ssl/certs/test.cluster.local.crt
        - /etc/ssl/certs/ci.cluster.local.crt
        - /etc/ssl/certs/status.cluster.local.crt
      loop_control:
        loop_var: item_ssl_cert
      register: ssl_cert_stat_results

    - name: Assert SSL certificate files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_cert_result['stat']['exists']
          - item_cert_result['stat']['size'] > 0
          - item_cert_result['stat']['isreg']
        fail_msg: "Expected SSL certificate file not found or empty"
      loop: "{{ ssl_cert_stat_results['results'] }}"
      loop_control:
        loop_var: item_cert_result

    - name: Stat SSL private key files
      ansible.builtin.stat:
        path: "{{ item_ssl_key }}"
      loop:
        - /etc/ssl/private/test.cluster.local.key
        - /etc/ssl/private/ci.cluster.local.key
        - /etc/ssl/private/status.cluster.local.key
      loop_control:
        loop_var: item_ssl_key
      register: ssl_key_stat_results

    - name: Assert SSL private key files exist with restricted permissions
      ansible.builtin.assert:
        that:
          - item_key_result['stat']['exists']
          - item_key_result['stat']['size'] > 0
          - item_key_result['stat']['mode'] == '0640'
        fail_msg: "Expected SSL private key not found or has wrong permissions"
      loop: "{{ ssl_key_stat_results['results'] }}"
      loop_control:
        loop_var: item_key_result

# ---------------------------------------------------------------------------
# Play 4: Verify document roots and static files
# ---------------------------------------------------------------------------
- name: Verify document roots and static files
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat site document root directories
      ansible.builtin.stat:
        path: "{{ item_docroot }}"
      loop:
        - /opt/server/test
        - /opt/server/ci
        - /opt/server/status
      loop_control:
        loop_var: item_docroot
      register: docroot_stat_results

    - name: Assert site document root directories exist
      ansible.builtin.assert:
        that:
          - item_docroot_result['stat']['exists']
          - item_docroot_result['stat']['isdir']
          - item_docroot_result['stat']['mode'] == '0755'
        fail_msg: "Expected document root directory not found or has wrong permissions"
      loop: "{{ docroot_stat_results['results'] }}"
      loop_control:
        loop_var: item_docroot_result

    - name: Stat site index.html files
      ansible.builtin.stat:
        path: "{{ item_index }}"
      loop:
        - /opt/server/test/index.html
        - /opt/server/ci/index.html
        - /opt/server/status/index.html
      loop_control:
        loop_var: item_index
      register: index_stat_results

    - name: Assert site index.html files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_index_result['stat']['exists']
          - item_index_result['stat']['size'] > 0
          - item_index_result['stat']['isreg']
        fail_msg: "Expected index.html not found or empty"
      loop: "{{ index_stat_results['results'] }}"
      loop_control:
        loop_var: item_index_result

# ---------------------------------------------------------------------------
# Play 5: Verify security configuration
# ---------------------------------------------------------------------------
- name: Verify security configuration
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat security configuration files
      ansible.builtin.stat:
        path: "{{ item_sec_file }}"
      loop:
        - /etc/fail2ban/jail.local
        - /etc/sysctl.d/99-security.conf
      loop_control:
        loop_var: item_sec_file
      register: sec_file_stat_results

    - name: Assert security configuration files exist and are non-empty
      ansible.builtin.assert:
        that:
          - item_sec_result['stat']['exists']
          - item_sec_result['stat']['size'] > 0
          - item_sec_result['stat']['isreg']
        fail_msg: "Expected security config file not found or empty"
      loop: "{{ sec_file_stat_results['results'] }}"
      loop_control:
        loop_var: item_sec_result

    - name: Slurp fail2ban jail.local to verify jails are configured
      ansible.builtin.slurp:
        src: /etc/fail2ban/jail.local
      register: fail2ban_jail_content

    - name: Assert fail2ban jail.local contains expected jails
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'[nginx-http-auth]' in (fail2ban_jail_content['content'] | b64decode)"
          - "'bantime' in (fail2ban_jail_content['content'] | b64decode)"
        fail_msg: "fail2ban jail.local is missing expected jail configuration"

    - name: Slurp sysctl security config to verify kernel parameters
      ansible.builtin.slurp:
        src: /etc/sysctl.d/99-security.conf
      register: sysctl_conf_content

    - name: Assert sysctl security config contains expected kernel parameters
      ansible.builtin.assert:
        that:
          - "'net.ipv4.conf.all.accept_redirects' in (sysctl_conf_content['content'] | b64decode)"
          - "'net.ipv4.tcp_syncookies' in (sysctl_conf_content['content'] | b64decode)"
          - "'net.ipv6.conf.all.disable_ipv6' in (sysctl_conf_content['content'] | b64decode)"
        fail_msg: "sysctl security config is missing expected kernel parameters"

    - name: Slurp sshd_config to verify SSH hardening
      ansible.builtin.slurp:
        src: /etc/ssh/sshd_config
      register: sshd_config_content

    - name: Assert sshd_config contains SSH hardening directives
      ansible.builtin.assert:
        that:
          - "'PermitRootLogin no' in (sshd_config_content['content'] | b64decode)"
          - "'PasswordAuthentication no' in (sshd_config_content['content'] | b64decode)"
        fail_msg: "sshd_config is missing expected SSH hardening directives"
