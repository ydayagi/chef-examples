---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used during self-signed certificate generation for all three Nginx 
      virtual hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: The URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: The Conjur account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: The Conjur variable path for the SSL passphrase (e.g., production/nginx/ssl_passphrase)
        - id: ssl_passphrase
          type: string
          label: SSL Key Passphrase
          secret: true
          help_text: "The PEM passphrase used as -passout when generating self-signed RSA-2048 SSL certificates for test.cluster.local, ci.cluster.local, and status.cluster.local.
            Must be kept secret and used with no_log: true in Ansible tasks."
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - ssl_passphrase
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
