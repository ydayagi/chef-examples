---
- name: Deploy nginx site configuration files
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-available/{{ item_site['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    mode: "0644"
    backup: true
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site
  notify: Reload nginx
  vars:
    server_name: "{{ item_site['key'] }}"
    document_root: "{{ item_site['value']['document_root'] }}"
    ssl_enabled: "{{ item_site['value']['ssl_enabled'] }}"
    cert_file: "{{ nginx_multisite_ssl_certificate_path }}/{{ item_site['key'] }}.crt"
    key_file: "{{ nginx_multisite_ssl_private_key_path }}/{{ item_site['key'] }}.key"

- name: Enable nginx sites via symlinks # noqa: L021 - state: link creates a symlink; mode is not meaningful for symlinks and is ignored by the OS
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ item_site_link['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    dest: /etc/nginx/sites-enabled/{{ item_site_link['key'] }} # noqa: R114 - path from role-defined sites dict, not user input
    state: link
  loop: "{{ nginx_multisite_sites | dict2items }}"
  loop_control:
    loop_var: item_site_link
  notify: Reload nginx

- name: Remove default nginx site # noqa: L021 - state: absent removes a file; mode is not applicable to deletion
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx
