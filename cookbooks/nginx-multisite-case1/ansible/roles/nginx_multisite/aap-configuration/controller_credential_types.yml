---
controller_credential_types:
  - name: CyberArk Conjur SSL Passphrase
    description: CyberArk Conjur credential for retrieving the SSL private key passphrase used to generate self-signed TLS certificates for all three nginx 
      virtual hosts
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: The URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: The CyberArk Conjur account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: The Conjur variable path for the SSL passphrase (e.g., production/nginx/ssl_passphrase)
        - id: conjur_api_key
          type: string
          label: Conjur API Key
          secret: true
          help_text: The API key or host factory token used to authenticate to the CyberArk Conjur API
        - id: ssl_passphrase
          type: string
          label: SSL Passphrase
          secret: true
          help_text: The PEM passphrase retrieved from Conjur at path production/nginx/ssl_passphrase; injected as -passout when generating self-signed RSA 
            2048-bit TLS certificates for test.cluster.local, ci.cluster.local, and status.cluster.local
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - conjur_api_key
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        conjur_api_key: !unsafe "{{ conjur_api_key }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
