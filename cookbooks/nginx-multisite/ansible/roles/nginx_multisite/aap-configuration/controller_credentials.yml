---
controller_credentials:
  - name: CyberArk Conjur Nginx SSL - nginx_multisite
    description: CyberArk Conjur credential for retrieving the SSL certificate passphrase used to generate self-signed TLS certificates for all three nginx 
      virtual hosts.
    organization: Default
    credential_type: CyberArk Conjur Nginx SSL
    update_secrets: true
    inputs:
      conjur_appliance_url: "{{ conjur_appliance_url }}"
      conjur_account: "{{ conjur_account }}"
      conjur_variable_path: "{{ conjur_variable_path }}"
      conjur_api_token: "{{ vault_conjur_api_token }}"
      ssl_passphrase: "{{ vault_ssl_passphrase }}"
  - name: OAuth Client Credentials Token - nginx_multisite
    description: OAuth2 client credentials used to obtain an access token from the internal OAuth endpoint. The client_secret was previously hardcoded as 
      'sup3rs3cr3t' in recipes/security.rb and must be rotated and stored securely before migration.
    organization: Default
    credential_type: OAuth Client Credentials Token
    update_secrets: true
    inputs:
      auth_url: "{{ auth_url }}"
      client_id: "{{ client_id }}"
      client_secret: "{{ vault_client_secret }}"
  - name: Parsed Token Endpoint - nginx_multisite
    description: Runtime-fetched token retrieved via HTTP GET from a custom API endpoint. The response body is parsed with a regex pattern to extract a token 
      value. No static credential is stored in the cookbook; the endpoint URL and parse pattern are hardcoded in the fetch_and_parse_token resource.
    organization: Default
    credential_type: Parsed Token Endpoint
    update_secrets: true
    inputs:
      token_url: "{{ token_url }}"
      extracted_token: "{{ vault_extracted_token }}"
