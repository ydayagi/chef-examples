---
controller_credential_types:
  - name: CyberArk Conjur Nginx SSL
    description: CyberArk Conjur credential for retrieving the SSL certificate passphrase used to generate self-signed TLS certificates for all three nginx 
      virtual hosts.
    kind: cloud
    inputs:
      fields:
        - id: conjur_appliance_url
          type: string
          label: Conjur Appliance URL
          help_text: The URL of the CyberArk Conjur appliance (e.g., https://conjur.example.com)
        - id: conjur_account
          type: string
          label: Conjur Account
          help_text: The Conjur organization account name (e.g., myorg)
        - id: conjur_variable_path
          type: string
          label: Conjur Variable Path
          help_text: The Conjur variable path for the SSL passphrase (e.g., production/nginx/ssl_passphrase)
        - id: conjur_api_token
          type: string
          label: Conjur API Token
          secret: true
          help_text: The API token or authn credential used to authenticate to the Conjur appliance
        - id: ssl_passphrase
          type: string
          label: SSL Certificate Passphrase
          secret: true
          help_text: The passphrase retrieved from Conjur at path production/nginx/ssl_passphrase, passed to openssl req -x509 via -passout for generating 
            self-signed TLS certificates for test.cluster.local, ci.cluster.local, and status.cluster.local
      required:
        - conjur_appliance_url
        - conjur_account
        - conjur_variable_path
        - conjur_api_token
    injectors:
      extra_vars:
        conjur_appliance_url: !unsafe "{{ conjur_appliance_url }}"
        conjur_account: !unsafe "{{ conjur_account }}"
        conjur_variable_path: !unsafe "{{ conjur_variable_path }}"
        conjur_api_token: !unsafe "{{ conjur_api_token }}"
        ssl_passphrase: !unsafe "{{ ssl_passphrase }}"
  - name: OAuth Client Credentials Token
    description: OAuth2 client credentials used to obtain an access token from the internal OAuth endpoint. The client_secret was previously hardcoded as 
      'sup3rs3cr3t' in recipes/security.rb and must be rotated and stored securely before migration.
    kind: cloud
    inputs:
      fields:
        - id: auth_url
          type: string
          label: OAuth Token Endpoint URL
          help_text: The full URL of the OAuth2 token endpoint (e.g., https://auth.example.com/oauth/token)
        - id: client_id
          type: string
          label: OAuth Client ID
          help_text: The OAuth2 client ID used in the client credentials grant (e.g., nginx-multisite)
        - id: client_secret
          type: string
          label: OAuth Client Secret
          secret: true
          help_text: The OAuth2 client secret used in the client credentials grant. Previously hardcoded as 'sup3rs3cr3t' in recipes/security.rb — must be 
            rotated before migration. Referenced as {{ oauth_client_secret }} in the Ansible role.
      required:
        - auth_url
        - client_id
        - client_secret
    injectors:
      extra_vars:
        auth_url: !unsafe "{{ auth_url }}"
        client_id: !unsafe "{{ client_id }}"
        client_secret: !unsafe "{{ client_secret }}"
  - name: Parsed Token Endpoint
    description: Runtime-fetched token retrieved via HTTP GET from a custom API endpoint. The response body is parsed with a regex pattern to extract a token 
      value. No static credential is stored in the cookbook; the endpoint URL and parse pattern are hardcoded in the fetch_and_parse_token resource.
    kind: cloud
    inputs:
      fields:
        - id: token_url
          type: string
          label: Token Endpoint URL
          help_text: The full URL to GET for token retrieval (e.g., https://api.example.com/token_endpoint)
        - id: extracted_token
          type: string
          label: Extracted Token
          secret: true
          help_text: The token value extracted from the response body by matching the regex pattern 'pattern1:(.+)'. Stored in 
            node.run_state['extracted_token']. The actual production pattern must be clarified with the owning team before migration.
      required:
        - token_url
    injectors:
      extra_vars:
        token_url: !unsafe "{{ token_url }}"
        extracted_token: !unsafe "{{ extracted_token }}"
