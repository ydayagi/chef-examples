---
# nginx_multisite role defaults
# Sites configuration
nginx_multisite_sites:
  test.cluster.local:
    document_root: /opt/server/test
    ssl_enabled: true
  ci.cluster.local:
    document_root: /opt/server/ci
    ssl_enabled: true
  status.cluster.local:
    document_root: /opt/server/status
    ssl_enabled: true
# SSL certificate paths
nginx_multisite_ssl_certificate_path: /etc/ssl/certs
nginx_multisite_ssl_private_key_path: /etc/ssl/private
# SSL certificate subject fields
nginx_multisite_ssl_cert_country: US
nginx_multisite_ssl_cert_state: Example
nginx_multisite_ssl_cert_locality: Example
nginx_multisite_ssl_cert_org: Example Org
nginx_multisite_ssl_cert_ou: IT
nginx_multisite_ssl_cert_email: admin@example.com
nginx_multisite_ssl_cert_days: 365
# Security settings
nginx_multisite_fail2ban_enabled: true
nginx_multisite_ufw_enabled: true
nginx_multisite_ssh_disable_root: true
nginx_multisite_ssh_password_auth: false
# OAuth token fetch settings (credentials injected by AAP)
# auth_url, client_id, client_secret, token_url, extracted_token
# are injected at runtime via AAP credential type
# CyberArk Conjur settings (injected by AAP credential type)
# conjur_appliance_url, conjur_account, conjur_variable_path, conjur_api_token
# ssl_passphrase are injected at runtime via AAP credential type
# Secure logging toggle — set to false only for debugging
nginx_multisite_secure_logging: true
