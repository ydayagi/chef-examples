---
argument_specs:
  main:
    short_description: Configure nginx multi-site web server with SSL, fail2ban, and UFW hardening
    description:
      - Installs and configures nginx to host multiple SSL-enabled virtual hosts.
      - Hardens the host with fail2ban, UFW firewall rules, and kernel sysctl security settings.
      - Generates self-signed TLS certificates for each configured virtual host.
      - Hardens SSH configuration by disabling root login and password authentication.
    options:
      nginx_multisite_sites:
        type: dict
        required: false
        default:
          test.cluster.local:
            document_root: /opt/server/test
            ssl_enabled: true
          ci.cluster.local:
            document_root: /opt/server/ci
            ssl_enabled: true
          status.cluster.local:
            document_root: /opt/server/status
            ssl_enabled: true
        description: >-
          Dictionary of virtual host sites to configure. Each key is the server_name
          (FQDN) and the value is a dict with document_root (str) and ssl_enabled (bool).
      nginx_multisite_ssl_certificate_path:
        type: str
        required: false
        default: /etc/ssl/certs
        description: Directory path where SSL certificates (.crt files) are stored.
      nginx_multisite_ssl_private_key_path:
        type: str
        required: false
        default: /etc/ssl/private
        description: Directory path where SSL private keys (.key files) are stored.
      nginx_multisite_ssl_cert_country:
        type: str
        required: false
        default: US
        description: Two-letter country code for the SSL certificate subject field.
      nginx_multisite_ssl_cert_state:
        type: str
        required: false
        default: Example
        description: State or province name for the SSL certificate subject field.
      nginx_multisite_ssl_cert_locality:
        type: str
        required: false
        default: Example
        description: Locality (city) name for the SSL certificate subject field.
      nginx_multisite_ssl_cert_org:
        type: str
        required: false
        default: Example Org
        description: Organization name for the SSL certificate subject field.
      nginx_multisite_ssl_cert_ou:
        type: str
        required: false
        default: IT
        description: Organizational unit name for the SSL certificate subject field.
      nginx_multisite_ssl_cert_email:
        type: str
        required: false
        default: admin@example.com
        description: Email address for the SSL certificate subject field.
      nginx_multisite_ssl_cert_days:
        type: int
        required: false
        default: 365
        description: Number of days the self-signed SSL certificate is valid for.
      nginx_multisite_fail2ban_enabled:
        type: bool
        required: false
        default: true
        description: Whether to install and configure fail2ban intrusion prevention.
      nginx_multisite_ufw_enabled:
        type: bool
        required: false
        default: true
        description: Whether to configure UFW firewall rules.
      nginx_multisite_ssh_disable_root:
        type: bool
        required: false
        default: true
        description: Whether to disable root SSH login in sshd_config.
      nginx_multisite_ssh_password_auth:
        type: bool
        required: false
        default: false
        description: Whether to allow SSH password authentication. Set to false to disable.
      nginx_multisite_secure_logging:
        type: bool
        required: false
        default: true
        description: >-
          Controls no_log on tasks that handle secrets (ssl_passphrase, client_secret,
          extracted_token). Set to false only for debugging — this will expose secrets
          in job output.
      ssl_passphrase:
        type: str
        required: true
        description: >-
          Passphrase used when generating self-signed SSL certificates with openssl.
          Injected at runtime by the AAP CyberArk Conjur credential type.
      conjur_appliance_url:
        type: str
        required: true
        description: >-
          URL of the CyberArk Conjur appliance. Injected at runtime by the AAP credential type.
      conjur_account:
        type: str
        required: true
        description: >-
          CyberArk Conjur account name. Injected at runtime by the AAP credential type.
      conjur_variable_path:
        type: str
        required: true
        description: >-
          CyberArk Conjur variable path for the SSL passphrase. Injected at runtime by the AAP credential type.
      conjur_api_token:
        type: str
        required: true
        description: >-
          CyberArk Conjur API token for authentication. Injected at runtime by the AAP credential type.
      auth_url:
        type: str
        required: true
        description: >-
          OAuth2 token endpoint URL for fetching the access token.
          Injected at runtime by the AAP credential type.
      client_id:
        type: str
        required: true
        description: >-
          OAuth2 client ID for the token fetch request.
          Injected at runtime by the AAP credential type.
      client_secret:
        type: str
        required: true
        description: >-
          OAuth2 client secret for the token fetch request. Sensitive.
          Injected at runtime by the AAP credential type.
      token_url:
        type: str
        required: true
        description: >-
          URL for the secondary token endpoint (fetch_and_parse_token).
          Injected at runtime by the AAP credential type.
      extracted_token:
        type: str
        required: true
        description: >-
          Token value extracted from the secondary token endpoint response. Sensitive.
          Injected at runtime by the AAP credential type.
