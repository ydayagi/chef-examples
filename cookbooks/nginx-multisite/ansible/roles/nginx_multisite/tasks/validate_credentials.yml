---
- name: Validate required credential variables are defined
  ansible.builtin.assert:
    that:
      - conjur_appliance_url is defined
      - conjur_account is defined
      - conjur_variable_path is defined
      - conjur_api_token is defined
      - ssl_passphrase is defined
      - auth_url is defined
      - client_id is defined
      - client_secret is defined
      - token_url is defined
      - extracted_token is defined
    fail_msg: One or more required credential variables are not defined. Ensure the AAP credential type is attached to the job template.
    quiet: true
